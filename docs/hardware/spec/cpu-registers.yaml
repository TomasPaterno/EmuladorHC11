    review_status: human_verified
  - id: B
    width_bits: 8
    role: accumulator
    source: { source_id: E5, section: "4.2.1", printed_page: 74, pdf_page: 74 }
    review_status: human_verified
  - id: D
    width_bits: 16
    role: composite_accumulator
